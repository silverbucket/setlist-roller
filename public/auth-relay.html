<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- OAuth relay CSP (#79). Tighter than the app shell: this page only
         posts OAuth params back to the opener and has no network fetches.
         Script is external (auth-relay.js) so script-src stays 'self'. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'"
    />
    <title>Setlist Roller Login</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #111318;
        color: #f4f1ea;
      }

      main {
        width: min(100%, 420px);
        padding: 24px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
        color: rgba(244, 241, 234, 0.8);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Returning to Setlist Roller</h1>
      <p id="message">Finishing login and handing control back to the installed app.</p>
    </main>
    <script src="/auth-relay.js"></script>
  </body>
</html>
